<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cosmos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="stars-canvas"></canvas>

  <canvas id="globe-canvas"></canvas>

  <div id="gadget-inventory">
    <div class="gadget-slot" data-gadget="moon" id="gadget-moon">
      <svg class="gadget-moon-icon" viewBox="-14 -14 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path fill-rule="evenodd"
              fill="rgba(200, 180, 255, 0.90)"
              d="M 11,0 A 11,11 0 1,0 -11,0 A 11,11 0 1,0 11,0 Z
                 M 2.5,0 A 6.5,6.5 0 1,0 -10.5,0 A 6.5,6.5 0 1,0 2.5,0 Z"/>
      </svg>
      <div class="gadget-tooltip">
        <span class="gadget-tooltip-name">Click to Deploy</span>
      </div>
    </div>
    <div class="gadget-slot" data-gadget="blackhole" id="gadget-blackhole">
      <div class="cooldown-ring"></div>
      <div class="gadget-tooltip">
        <span class="gadget-tooltip-name">Black Hole</span>
        <span class="gadget-tooltip-hint">Click to place</span>
      </div>
    </div>

    <div class="gadget-slot" data-gadget="comet" id="gadget-comet">
      <div class="cooldown-ring"></div>
      <div class="gadget-tooltip">
        <span class="gadget-tooltip-name">Comet</span>
        <span class="gadget-tooltip-hint">Click to deploy</span>
      </div>
    </div>
    <div class="gadget-slot" data-gadget="meteor-shower" id="gadget-meteor-shower">
      <div class="cooldown-ring"></div>
      <div class="gadget-tooltip">
        <span class="gadget-tooltip-name">Meteor Shower</span>
        <span class="gadget-tooltip-hint">Click to deploy</span>
      </div>
    </div>
  </div>

  <button id="perf-toggle" class="perf-toggle" aria-label="Toggle performance mode">
    <span class="perf-toggle-track">
      <span class="perf-toggle-thumb"></span>
    </span>
  </button>

  <button id="mobile-toggle" class="perf-toggle" aria-label="Toggle mobile control mode">
    <span class="perf-toggle-track">
      <span class="perf-toggle-thumb"></span>
    </span>
  </button>

  <script src="utils.js"></script>
  <script src="moon.js"></script>
  <script src="globe.js"></script>
  <script src="blackhole.js"></script>
  <script src="comet.js"></script>
  <script src="asteroids.js"></script>
  <script src="spaceship.js"></script>
  <script src="meteor-shower.js"></script>
  <script src="gadgets.js"></script>
  <script src="stars.js"></script>
</body>
</html>
